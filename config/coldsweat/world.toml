
#─────────────────────────────────────────────────────────────────────────
# Anywhere that uses IDs, such as blocks, biomes, dimensions, and structures, also supports:
# • Tags (e.g. "#minecraft:is_underground")
# • Comma-separated lists (e.g. "minecraft:desert,#minecraft:is_badlands")
#     Applies the setting to all listed IDs. Can use tags, regular IDs, and negation interchangeably
# • Negation (e.g. "!minecraft:jungle_leaves")
#     Useful with lists/tags. Excludes the listed IDs from the setting
#     i.e. "#minecraft:leaves,!minecraft:jungle_leaves" (all leaves EXCEPT jungle leaves)
# Settings with "//v" will list elements vertically. Removing "//v" will list elements in one line
#─────────────────────────────────────────────────────────────────────────
[Dimensions]
	#─────────────────────────────────────────────────────────────────────────//v
	# Applies an offset to the world's temperature across an entire dimension
	# ├── Format: [["dimension_id", temperature, *units], [...], etc]
	# └── [* = optional]
	# • dimension_id: The ID of the dimension (e.g. "minecraft:the_nether")
	# • temperature: The temperature offset to apply to the dimension
	# • *units: The units of the temperature ("f", "c", or "mc"). Defaults to Minecraft units (mc))
	"Dimension Temperature Offsets" = [
	    ["minecraft:the_nether", 18, "c"],
	    ["minecraft:the_end", -3, "c"],
	    ["aether:the_aether", 18, "c"]
	]
	#─────────────────────────────────────────────────────────────────────────//v
	# Defines the temperature of a dimension, overriding biome and elevation temperature
	# ├── Format: [["dimension_id", temperature, *units], [...], etc]
	# └── [* = optional]
	# • dimension_id: The ID of the dimension (e.g. "minecraft:the_nether")
	# • temperature: The temperature of the dimension
	# • *units: The units of the temperature ("f", "c", or "mc"). Defaults to Minecraft units (mc))
	"Dimension Temperatures" = []

[Biomes]
	#─────────────────────────────────────────────────────────────────────────//v
	# Applies an offset to the temperature of a biome
	# ├── Format: [["biome_id", lowTemp, highTemp, *units, *waterTemp], [...], etc]
	# └── [* = optional]
	# • biome_id: The ID of the biome (e.g. "minecraft:desert")
	# • lowTemp: The temperature offset at midnight
	# • highTemp: The temperature offset at noon
	# • *units: The units of the temperature ("f", "c", or "mc"). Defaults to Minecraft units (mc))
	# • *waterTemp: Offsets the temperature of water in the biome
	"Biome Temperature Offsets" = []
	#─────────────────────────────────────────────────────────────────────────//v
	# Defines the temperature of a biome, overriding the biome's default temperature
	# ├── Format: [["biome_id", lowTemp, highTemp, *units, *waterTemp], [...], etc]
	# └── [* = optional]
	# • biome_id: The ID of the biome (e.g. "minecraft:desert")
	# • lowTemp: The temperature of the biome at midnight
	# • highTemp: The temperature of the biome at noon
	# • *units: The units of the temperature ("f", "c", or "mc"). Defaults to Minecraft units (mc))
	# • *waterTemp: The temperature of water in the biome
	# Five dry ambient baselines for common Overworld surface and travel biomes.
	# Cold Sweat still applies elevation, weather, immersion and local sources.
	# Unlisted biomes keep native defaults. Deep ocean is shared with Abyssal City;
	# these rules apply to a biome ID in every dimension, so it stays native.
	"Biome Temperatures" = [
	    # Freezing
	    ["minecraft:snowy_plains,minecraft:snowy_taiga,minecraft:ice_spikes,minecraft:grove,minecraft:snowy_slopes,minecraft:frozen_peaks", 0.22, 0.32, "mc"],
	    ["minecraft:jagged_peaks,minecraft:frozen_river,minecraft:frozen_ocean,minecraft:deep_frozen_ocean", 0.22, 0.32, "mc"],
	    ["natures_spirit:sleeted_slopes,natures_spirit:snowcapped_red_peaks,natures_spirit:snowy_fir_forest,natures_spirit:snowy_redwood_forest", 0.22, 0.32, "mc"],
	    ["natures_spirit:tundra,natures_spirit:boreal_taiga", 0.22, 0.32, "mc"],

	    # Cold
	    ["minecraft:taiga,minecraft:old_growth_pine_taiga,minecraft:old_growth_spruce_taiga,minecraft:windswept_forest,minecraft:windswept_hills", 0.48, 0.57, "mc"],
	    ["minecraft:windswept_gravelly_hills,minecraft:snowy_beach,minecraft:stony_shore,minecraft:cold_ocean,minecraft:deep_cold_ocean", 0.48, 0.57, "mc"],
	    ["natures_spirit:alpine_clearings,natures_spirit:alpine_highlands,natures_spirit:coniferous_covert", 0.48, 0.57, "mc"],
	    ["natures_spirit:fir_forest,natures_spirit:redwood_forest", 0.48, 0.57, "mc"],

	    # Temperate
	    ["minecraft:plains,minecraft:sunflower_plains,minecraft:forest,minecraft:birch_forest,minecraft:old_growth_birch_forest", 0.94, 1.12, "mc"],
	    ["minecraft:flower_forest,minecraft:dark_forest,minecraft:meadow,minecraft:cherry_grove,minecraft:swamp,minecraft:stony_peaks,minecraft:beach", 0.94, 1.12, "mc"],
	    ["minecraft:river,minecraft:ocean,minecraft:lukewarm_ocean,minecraft:deep_lukewarm_ocean,minecraft:warm_ocean", 0.94, 1.12, "mc"],
	    ["natures_spirit:aspen_forest,natures_spirit:blooming_sugi_forest,natures_spirit:carnation_fields,natures_spirit:cypress_fields", 0.94, 1.12, "mc"],
	    ["natures_spirit:floral_ridges,natures_spirit:golden_wilds,natures_spirit:heather_fields,natures_spirit:lavender_fields", 0.94, 1.12, "mc"],
	    ["natures_spirit:maple_woodlands,natures_spirit:marigold_meadows,natures_spirit:marsh,natures_spirit:prairie,natures_spirit:sugi_forest", 0.94, 1.12, "mc"],
	    ["natures_spirit:tropical_shores,natures_spirit:white_cliffs,natures_spirit:windswept_sugi_forest,natures_spirit:wisteria_forest", 0.94, 1.12, "mc"],
	    ["ars_nouveau:archwood_forest", 0.94, 1.12, "mc"],
	    ["hexerei:willow_swamp", 0.94, 1.12, "mc"],

	    # Hot
	    ["minecraft:desert,minecraft:savanna,minecraft:savanna_plateau,minecraft:windswept_savanna,minecraft:jungle,minecraft:bamboo_jungle", 1.38, 1.48, "mc"],
	    ["minecraft:sparse_jungle,minecraft:mangrove_swamp", 1.38, 1.48, "mc"],
