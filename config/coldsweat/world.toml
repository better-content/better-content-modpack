		# └── [* = optional]
		# • seasonStart/Mid/End: The temperature offset at the start, middle, and end of the season
		# • *units: The unit of temperature (C, F, or MC)
		# ⌄ 
		Summer = [2, 4, 2, "C"]
		Autumn = [1, 0, -1, "C"]
		Winter = [-3, -6, -3, "C"]
		Spring = [-1, 0, 1, "C"]
