	#Range: 0.0 ~ 1.0
	BeamStrength = 0.9

	#The mass of the block(s), in kilograms.
	#Range: 1.0 ~ 50000.0
	Mass = 1600.0

	#Whether the block(s) can hang from other blocks for support.
