
[mapping]
	#Heat Sync heat value that corresponds to Cold Sweat 0 MC / 0 C.
	#Range: 0.0 ~ 1.7976931348623157E308
	absolute_zero_offset = 100.0
	#How many Heat Sync heat units correspond to one Cold Sweat MC unit.
	#Range: 1.0E-4 ~ 1.7976931348623157E308
	cs_to_heat_scale = 40.0
	#Minimum pipe heat. Zero is absolute zero in the bridge model.
	#Range: 0.0 ~ 1.7976931348623157E308
	pipe_min_heat = 0.0
	#Maximum pipe heat.
	#Range: 0.0 ~ 1.7976931348623157E308
	pipe_max_heat = 400.0

[thermal_firebox]
	#HeatSync heat released per burning tick. Fuel duration remains the furnace burn duration.
	#Range: 0.0 ~ 1.7976931348623157E308
	heat_per_tick = 6.0
	#Firebox target heat. It stops consuming new fuel at or above this value.
	#Range: 0.0 ~ 1.7976931348623157E308
	target_heat = 360.0

[pneumaticcraft]
	#HeatSync heat corresponding to PneumaticCraft ambient temperature.
	#Range: 0.0 ~ 1.7976931348623157E308
	ambient_heat = 100.0
	#PneumaticCraft ambient temperature in Kelvin.
	#Range: 0.0 ~ 1.7976931348623157E308
	ambient_temperature_k = 295.15
	#HeatSync heat units per PneumaticCraft Kelvin.
	#Range: 1.0E-4 ~ 1.7976931348623157E308
	heat_per_kelvin = 0.25

[impossible_transducer]
	#Containment-only Forge Energy buffer. FE is never converted into AE.
	#Range: > 1
	fe_capacity = 100000
	#Containment FE consumed per finite source-owned unbinding unit.
	#Range: > 1
	fe_per_unit = 2000
	#Fixed maximum unbinding units per transducer per tick; scale by parallel blocks.
	#Range: 1 ~ 64
	units_per_tick = 1
	#Heat at which the transducer melts into lava after retaining unbinding heat.
	#Range: 1.0 ~ 1.7976931348623157E308
	max_heat = 400.0

[boiler_heater]
	#Maximum heat stored by a Boiler Heater.
	#Range: 100.0 ~ 1.7976931348623157E308
	max_heat = 400.0
	#Range: 0.0 ~ 1.7976931348623157E308
	strength_1_threshold = 180.0
	#Range: 0.0 ~ 1.7976931348623157E308
	strength_2_threshold = 260.0
	#Range: 0.0 ~ 1.7976931348623157E308
	strength_3_threshold = 340.0
	#Range: 0.0 ~ 1.7976931348623157E308
	strength_1_cost_per_tick = 1.0
	#Range: 0.0 ~ 1.7976931348623157E308
	strength_2_cost_per_tick = 2.0
	#Range: 0.0 ~ 1.7976931348623157E308
	strength_3_cost_per_tick = 3.0

[pipe_behavior]
	#How strongly local Cold Sweat ambient pulls pipe heat toward its baseline each update.
	#Range: 0.0 ~ 1.0
	ambient_blend_rate = 0.08
	#Passive loss toward Heat Sync neutral per update.
	#Range: 0.0 ~ 1.7976931348623157E308
	pipe_loss_per_tick = 0.5
	#How strongly connected neighbors pull a pipe toward their average heat.
	#Range: 0.0 ~ 1.0
	network_equalization_strength = 0.3
	#How strongly adjacent cold sources pull a pipe toward their source heat.
	#Range: 0.0 ~ 1.0
	cold_source_pull_rate = 0.18

[cold_sources]
	#Target Heat Sync heat for adjacent ice.
	#Range: 0.0 ~ 1.7976931348623157E308
	ice_source_heat = 80.0
	#Target Heat Sync heat for adjacent packed ice.
	#Range: 0.0 ~ 1.7976931348623157E308
	packed_ice_source_heat = 50.0
	#Target Heat Sync heat for adjacent blue ice.
	#Range: 0.0 ~ 1.7976931348623157E308
	blue_ice_source_heat = 20.0
	#Target heat for any other block in better_industrial_heat:pipe_cold_sources.
	#Range: 0.0 ~ 1.7976931348623157E308
	tagged_cold_source_default_heat = 80.0

[radiation]
	#How far pipe-emitted Cold Sweat block temperature reaches.
	#Range: 0.0 ~ 1.7976931348623157E308
	pipe_blocktemp_range = 5.0
	#Absolute Cold Sweat MC temperature cap emitted by a pipe.
	#Range: 0.0 ~ 1.7976931348623157E308
	pipe_blocktemp_max_effect = 0.75

[power_grid]
	#HeatSync heat value corresponding to Power Grid ambient device temperature.
	#Range: 0.0 ~ 1.7976931348623157E308
	ambient_heat = 100.0
	#Power Grid ambient device temperature in Celsius.
	#Range: -273.15 ~ 1.7976931348623157E308
	ambient_temperature_c = 22.0
	#HeatSync heat units per one Power Grid Celsius degree. Default maps 1200 C near HeatSync 400.
	#Range: 1.0E-4 ~ 1.7976931348623157E308
	heat_per_degree_c = 0.2546689303904924
	#Maximum HeatSync heat exposed by Power Grid thermal devices.
	#Range: 1.0 ~ 1.7976931348623157E308
	max_heat = 400.0
