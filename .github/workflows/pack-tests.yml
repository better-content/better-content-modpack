name: Explicit Smoke or Soak

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Existing-artifact lifecycle
        type: choice
        options: [smoke, soak]
        default: smoke
      minutes:
        description: Connected minutes for Soak (1..240 on this CI runner)
        default: '30'
      client_url:
        description: URL of the existing packaged client ZIP
        required: true
      server_url:
        description: URL of the existing packaged server ZIP
        required: true

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Kotlin SDK
        run: bash .github/scripts/install-kotlin.sh
      - name: Install client runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth pipx libgl1-mesa-dri
      - name: Download existing artifacts (no build or packaging)
        env:
          CLIENT_URL: ${{ inputs.client_url }}
          SERVER_URL: ${{ inputs.server_url }}
        run: |
          mkdir -p dist/candidate/client dist/candidate/server
          curl --fail --location --retry 3 "$CLIENT_URL" -o dist/candidate/client/better-content.zip
          curl --fail --location --retry 3 "$SERVER_URL" -o dist/candidate/server/better-content.zip
      - name: Run selected lifecycle
        env:
          TIER: ${{ inputs.tier }}
          MINUTES: ${{ inputs.minutes }}
          BC_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$HOME/.tmp"
          export TMPDIR="$HOME/.tmp"
          if [ "$TIER" = soak ]; then
            [[ "$MINUTES" =~ ^[0-9]+$ ]] && ((MINUTES >= 1 && MINUTES <= 240))
            ./test.main.kts soak --minutes "$MINUTES"
          else
            ./test.main.kts smoke
          fi
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-evidence
          path: generated/test-evidence/
          retention-days: 30
