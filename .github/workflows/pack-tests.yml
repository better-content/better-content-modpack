name: Explicit pack tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKWIZ_REVISION: v0.0.0-20260906154125-ef87d964f8cb

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Kotlin SDK
        run: bash .github/scripts/install-kotlin.sh
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install pinned packaging tool
        run: go install github.com/packwiz/packwiz@${PACKWIZ_REVISION}
      - name: Download Forge installer
        run: |
          curl --fail --location --retry 3 \
            --output forge-1.20.1-47.4.13-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.13/forge-1.20.1-47.4.13-installer.jar
      - name: Package exactly once
        run: ./dist.sh
      - name: Record candidate hashes
        run: |
          cd dist
          find . -type f -name better-content.zip -print0 | sort -z | xargs -0 sha256sum > candidate-sha256.txt
      - name: Validate candidate contracts
        env:
          BC_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-candidate
        run: ./test.main.kts candidate
      - name: Upload exact candidate pair
        uses: actions/upload-artifact@v4
        with:
          name: packaged-candidates
          path: dist/
          retention-days: 30
      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence
          path: |
            generated/test-evidence/
            build/reports/tests/candidateTest/
            build/test-results/candidateTest/
          retention-days: 30

  runtime:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        suite: [server, multiplayer, singleplayer]
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Kotlin SDK
        run: bash .github/scripts/install-kotlin.sh
      - uses: actions/setup-go@v5
        if: matrix.suite != 'server'
        with:
          go-version: stable
          cache: false
      - name: Install client test dependencies
        if: matrix.suite != 'server'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb pipx
          go install github.com/packwiz/packwiz@${PACKWIZ_REVISION}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: packaged-candidates
          path: dist
      - name: Verify downloaded candidate hashes
        run: cd dist && sha256sum --check candidate-sha256.txt
      - name: Run selected pack suite
        env:
          BC_TEST_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}
        run: ./test.main.kts ${{ matrix.suite }}
      - name: Upload durable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-evidence
          path: |
            generated/test-evidence/
            build/reports/tests/${{ matrix.suite }}Test/
            build/test-results/${{ matrix.suite }}Test/
          retention-days: 30
