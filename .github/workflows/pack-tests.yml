name: Explicit pack tests

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Cumulative tier to run on freshly built local source JARs
        type: choice
        required: true
        default: debug
        options:
          - dist
          - debug

permissions:
  contents: read

env:
  PACKWIZ_REVISION: v0.0.0-20260906154125-ef87d964f8cb

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Kotlin SDK
        run: bash .github/scripts/install-kotlin.sh
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install pinned packaging tool
        run: |
          mkdir -p "$HOME/.local/bin"
          GOBIN="$HOME/.local/bin" go install github.com/packwiz/packwiz@${PACKWIZ_REVISION}
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install client test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb pipx
      - name: Check out pinned custom sources
        run: >-
          python3 .github/scripts/checkout-ci-sources.py
          --manifest .github/ci-source-revisions.json
          --workspace "$GITHUB_WORKSPACE/.."
      - name: Download Forge installer
        run: |
          curl --fail --location --retry 3 \
            --output forge-1.20.1-47.4.13-installer.jar \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.13/forge-1.20.1-47.4.13-installer.jar
      - name: Run cumulative tier on one fresh candidate
        run: ./test.main.kts run "${{ inputs.tier }}"
      - name: Upload candidate and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tier }}-evidence
          path: |
            generated/test-evidence/
            build/reports/tests/
            build/test-results/
            dist/
          retention-days: 30
