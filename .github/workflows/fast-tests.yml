name: Fast test harness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Kotlin SDK
        run: bash .github/scripts/install-kotlin.sh
      - name: Verify provider bootstrap
        run: python3 .github/scripts/test_prepare_provider_jars.py
      - name: Check out pinned sources for the reflection boundary
        run: >-
          python3 .github/scripts/checkout-ci-sources.py
          --manifest .github/ci-source-revisions.json
          --workspace "$GITHUB_WORKSPACE/.."
      - name: Compile and run Minecraft-free harness tests
        run: ./test.main.kts fast
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 30
