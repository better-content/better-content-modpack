name: Local implementation checks

on:
  push:
    branches-ignore:
      - experimental/world-condenser
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Kotlin SDK
        run: bash .github/scripts/install-kotlin.sh
      - name: Verify provider bootstrap
        run: python3 .github/scripts/test_prepare_provider_jars.py
      - name: Compile and run Minecraft-free harness tests
        run: ./gradlew test --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 30
